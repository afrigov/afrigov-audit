<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Renew a passport – Ministry of Interior</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        color: #1b1b1b;
        background: #fff;
      }
      .skip {
        position: absolute;
        left: -999em;
      }
      .skip:focus {
        left: 8px;
        top: 8px;
      }
      header,
      main,
      footer {
        padding: 16px;
      }
      a {
        color: #1f4e79;
        text-decoration: underline;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
      }
      input {
        display: block;
        min-height: 48px;
        width: 100%;
        max-width: 20rem;
        border: 2px solid #767676;
        padding: 8px;
        font: inherit;
      }
      button {
        min-height: 48px;
        padding: 8px 24px;
        background: #1f4e79;
        color: #fff;
        border: 2px solid #1f4e79;
        font: inherit;
        font-weight: bold;
      }
      nav a {
        display: inline-block;
        min-height: 48px;
        line-height: 48px;
        padding: 0 12px;
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to main content</a>
    <header>
      <nav aria-label="Main">
        <a href="/">Home</a>
        <a href="/services">Services</a>
      </nav>
    </header>
    <main id="main" tabindex="-1">
      <h1>Renew a passport</h1>
      <p>
        Takes about 10 minutes. You will need your national ID and a payment card or mobile money.
      </p>
      <form action="/apply" method="post">
        <label for="nin">National ID number</label>
        <input id="nin" name="nin" type="text" inputmode="numeric" autocomplete="off" />
        <button type="submit">Continue</button>
      </form>
    </main>
    <footer>
      <p>© Ministry of Interior</p>
    </footer>
  </body>
</html>
